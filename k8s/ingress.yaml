apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanboard-ingress
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    # Main UI
    - host: kanboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanboard-ui
                port:
                  number: 3000
    # Kanboard PHP API (internal, but exposed for testing)
    - host: kanboard-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanboard
                port:
                  number: 80
    # Maestro API
    - host: maestro.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanboard-backend
                port:
                  number: 8000
