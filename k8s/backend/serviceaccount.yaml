apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanboard-backend
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanboard-sandbox-manager
  namespace: hr-project-tracking-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanboard-backend-sandbox
  namespace: hr-project-tracking-sandbox
subjects:
  - kind: ServiceAccount
    name: kanboard-backend
    namespace: hr-project-tracking
roleRef:
  kind: Role
  name: kanboard-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
