apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard-ui
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard-ui
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: kanboard-ui
          image: ghcr.io/albrightlaboratories/kanboard-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: KANBOARD_API_URL
              value: "http://kanboard.hr-project-tracking.svc.cluster.local"
            - name: MAESTRO_API_URL
              value: "http://kanboard-backend.hr-project-tracking.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://kanboard-backend.hr-project-tracking.svc.cluster.local:8000/ws"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
