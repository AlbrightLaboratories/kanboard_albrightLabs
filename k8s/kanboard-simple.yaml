apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard
    spec:
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.36
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/app/data
            - name: plugins
              mountPath: /var/www/app/plugins
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: data
          emptyDir: {}
        - name: plugins
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kanboard
  namespace: hr-project-tracking
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
  selector:
    app.kubernetes.io/name: kanboard
