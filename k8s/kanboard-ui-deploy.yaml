apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard-ui
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard-ui
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: kanboard-ui
          image: ghcr.io/albrightlaboratories/kanboard-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: kanboard-ui
  namespace: hr-project-tracking
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30089
  selector:
    app.kubernetes.io/name: kanboard-ui
