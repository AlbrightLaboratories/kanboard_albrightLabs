---
# PersistentVolumeClaim for Kanboard data (SQLite database)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-data-pvc
  namespace: hr-project-tracking
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: alidzy-nfs
  resources:
    requests:
      storage: 5Gi
---
# PersistentVolumeClaim for Kanboard plugins
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-plugins-pvc
  namespace: hr-project-tracking
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: alidzy-nfs
  resources:
    requests:
      storage: 1Gi
---
# Kanboard Deployment with Persistent Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard
    spec:
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.36
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/app/data
            - name: plugins
              mountPath: /var/www/app/plugins
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kanboard-data-pvc
        - name: plugins
          persistentVolumeClaim:
            claimName: kanboard-plugins-pvc
---
# Service (unchanged)
apiVersion: v1
kind: Service
metadata:
  name: kanboard
  namespace: hr-project-tracking
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
  selector:
    app.kubernetes.io/name: kanboard
