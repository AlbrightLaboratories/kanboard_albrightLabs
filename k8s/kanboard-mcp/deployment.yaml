apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard-mcp
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard-mcp
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: kanboard-mcp
          image: ghcr.io/albrightlaboratories/kanboard-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: mcp
          env:
            - name: KANBOARD_URL
              value: "http://kanboard.hr-project-tracking.svc.cluster.local"
            - name: KANBOARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanboard-secrets
                  key: api-token
            - name: MAESTRO_URL
              value: "http://kanboard-backend.hr-project-tracking.svc.cluster.local:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
