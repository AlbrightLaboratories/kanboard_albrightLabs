apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-postgres-pvc
  namespace: hr-project-tracking
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard-postgres
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kanboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard-postgres
  strategy:
    type: Recreate  # Required for PVC
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kanboard
            - name: POSTGRES_USER
              value: kanboard
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanboard-postgres-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kanboard
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kanboard
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: kanboard-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kanboard-postgres
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard-postgres
spec:
  selector:
    app.kubernetes.io/name: kanboard-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: kanboard-postgres-secret
  namespace: hr-project-tracking
type: Opaque
stringData:
  password: "kanboard-secure-pwd-2024"
