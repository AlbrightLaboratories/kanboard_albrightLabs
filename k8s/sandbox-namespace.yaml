apiVersion: v1
kind: Namespace
metadata:
  name: hr-project-tracking-sandbox
  labels:
    app.kubernetes.io/name: kanboard
    app.kubernetes.io/part-of: kanboard-albrightlabs
    purpose: sandbox-execution
---
# Resource quota for sandbox namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: hr-project-tracking-sandbox
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
# Limit range for sandbox jobs
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: hr-project-tracking-sandbox
spec:
  limits:
    - default:
        memory: 512Mi
        cpu: 500m
      defaultRequest:
        memory: 256Mi
        cpu: 100m
      max:
        memory: 2Gi
        cpu: 2000m
      type: Container
---
# Network policy to isolate sandbox
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: hr-project-tracking-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow access to GitHub for cloning repos
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
