apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-comment-listener
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: hermes-comment-listener
    app.kubernetes.io/component: agent-integration
    app.kubernetes.io/part-of: kanboard
spec:
  replicas: 1  # Single instance to avoid duplicate processing
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-comment-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-comment-listener
    spec:
      containers:
        - name: hermes-listener
          image: ghcr.io/albrightlaboratories/kanboard-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "scripts.hermes_comment_listener.orchestration"]
          env:
            - name: KANBOARD_URL
              value: "http://kanboard.hr-project-tracking.svc.cluster.local/jsonrpc.php"
            - name: KANBOARD_USERNAME
              value: "albrightcda"
            - name: KANBOARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanboard-secrets
                  key: api-token
            # Corey-router for intelligent model routing (preferred)
            - name: COREY_ROUTER_URL
              value: "http://corey-router.corey-coder.svc.cluster.local:8081"
            # Direct Hermes URL (fallback for tool-heavy requests)
            - name: HERMES_URL
              value: "http://172.100.10.21:8642"
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-api-credentials
                  key: api-key
            - name: HERMES_ENABLED
              value: "1"
            # Use corey-router for intelligent model selection (1=enabled)
            - name: USE_COREY_ROUTER
              value: "1"
            - name: POLL_INTERVAL_SECONDS
              value: "30"  # Reduced from 5s to prevent SQLite lock contention
            # hermes-memory service for CoT persistence
            - name: HERMES_MEMORY_URL
              value: "http://hermes-memory.hermes-tools.svc.cluster.local:8080"
            # Enable automatic task movement
            - name: AUTO_MOVE_TASKS
              value: "1"
            # Redis for comment tracking persistence (optional)
            # - name: REDIS_URL
            #   value: "redis://redis.hr-project-tracking.svc.cluster.local:6379"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Health check - verify main loop is running
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
      restartPolicy: Always
# NOTE: Secrets (kanboard-secrets, hermes-api-credentials) are managed separately.
# Do not include them in this file to prevent overwrites with placeholder values.
