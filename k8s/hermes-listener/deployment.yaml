apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-comment-listener
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: hermes-comment-listener
    app.kubernetes.io/component: agent-integration
    app.kubernetes.io/part-of: kanboard
spec:
  replicas: 1  # Single instance to avoid duplicate processing
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-comment-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-comment-listener
    spec:
      containers:
        - name: hermes-listener
          image: ghcr.io/albrightlaboratories/kanboard-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "scripts.hermes_comment_listener.orchestration"]
          env:
            - name: KANBOARD_URL
              value: "http://kanboard.hr-project-tracking.svc.cluster.local/jsonrpc.php"
            - name: KANBOARD_USERNAME
              value: "admin"
            - name: KANBOARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanboard-secrets
                  key: api-token
            - name: HERMES_URL
              value: "http://172.100.10.21:8642"
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-api-credentials
                  key: api-key
            - name: HERMES_ENABLED
              value: "1"
            - name: POLL_INTERVAL_SECONDS
              value: "5"
            # Redis for comment tracking persistence (optional)
            # - name: REDIS_URL
            #   value: "redis://redis.hr-project-tracking.svc.cluster.local:6379"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Health check - verify main loop is running
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Secret
metadata:
  name: kanboard-api-credentials
  namespace: hr-project-tracking
type: Opaque
stringData:
  # This will be replaced with actual API token
  api-token: "REPLACE_WITH_KANBOARD_API_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-api-credentials
  namespace: hr-project-tracking
type: Opaque
stringData:
  # This will be replaced with actual Hermes API key
  api-key: "REPLACE_WITH_HERMES_API_KEY"
