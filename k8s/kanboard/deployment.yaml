apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.36
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_AUTHENTICATION_HEADER
              value: ""
            - name: DEBUG
              value: "false"
          volumeMounts:
            - name: kanboard-data
              mountPath: /var/www/app/data
            - name: kanboard-plugins
              mountPath: /var/www/app/plugins
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: kanboard-data
          persistentVolumeClaim:
            claimName: kanboard-data
        - name: kanboard-plugins
          persistentVolumeClaim:
            claimName: kanboard-plugins
