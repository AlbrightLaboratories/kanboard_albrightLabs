apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanboard
    spec:
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.36
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: kanboard-config
          env:
            # PostgreSQL Database Configuration
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOSTNAME
              value: "kanboard-postgres.hr-project-tracking.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "kanboard"
            - name: DB_USERNAME
              value: "kanboard"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanboard-postgres-secret
                  key: password
            # Brevo SMTP credentials
            - name: MAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: brevo-smtp-credentials
                  key: login
            - name: MAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brevo-smtp-credentials
                  key: key
          volumeMounts:
            - name: kanboard-data
              mountPath: /var/www/app/data
            - name: kanboard-plugins
              mountPath: /var/www/app/plugins
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: kanboard-data
          persistentVolumeClaim:
            claimName: kanboard-data-pvc
        - name: kanboard-plugins
          persistentVolumeClaim:
            claimName: kanboard-plugins-pvc
