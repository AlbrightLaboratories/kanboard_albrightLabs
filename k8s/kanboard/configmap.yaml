apiVersion: v1
kind: ConfigMap
metadata:
  name: kanboard-config
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
data:
  # Kanboard configuration
  API_AUTHENTICATION_HEADER: ""
  DEBUG: "false"
  # Enable JSON-RPC API
  ENABLE_URL_REWRITE: "true"
  # Internal network - no authentication required
  DISABLE_AUTHENTICATION: "false"
