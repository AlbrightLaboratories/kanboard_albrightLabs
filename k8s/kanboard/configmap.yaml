apiVersion: v1
kind: ConfigMap
metadata:
  name: kanboard-config
  namespace: hr-project-tracking
  labels:
    app.kubernetes.io/name: kanboard
data:
  # Kanboard configuration
  API_AUTHENTICATION_HEADER: ""
  DEBUG: "false"
  # Enable JSON-RPC API
  ENABLE_URL_REWRITE: "true"
  # Internal network - no authentication required
  DISABLE_AUTHENTICATION: "false"
  # Application URL for email links (password reset, notifications)
  APPLICATION_URL: "https://maestro-kanboard.albrightlab.com/"
  # Email configuration - Brevo (Sendinblue) SMTP
  MAIL_CONFIGURATION: "true"
  MAIL_FROM: "hr@albrightlab.com"
  MAIL_TRANSPORT: "smtp"
  MAIL_SMTP_HOSTNAME: "smtp-relay.brevo.com"
  MAIL_SMTP_PORT: "587"
  MAIL_SMTP_ENCRYPTION: "tls"
