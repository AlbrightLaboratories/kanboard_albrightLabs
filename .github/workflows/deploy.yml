name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'kanboard-ui/**'
      - 'kanboard-mcp/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-images:
    runs-on: albright-runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kanboard-ui
        uses: docker/build-push-action@v5
        with:
          context: ./kanboard-ui
          push: true
          tags: ghcr.io/albrightlaboratories/kanboard-ui:${{ github.sha }},ghcr.io/albrightlaboratories/kanboard-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kanboard-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/albrightlaboratories/kanboard-backend:${{ github.sha }},ghcr.io/albrightlaboratories/kanboard-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kanboard-mcp
        uses: docker/build-push-action@v5
        with:
          context: ./kanboard-mcp
          push: true
          tags: ghcr.io/albrightlaboratories/kanboard-mcp:${{ github.sha }},ghcr.io/albrightlaboratories/kanboard-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-images
    runs-on: albright-runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tags in kustomization
        run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/albrightlaboratories/kanboard-ui:${{ github.sha }} \
            ghcr.io/albrightlaboratories/kanboard-backend:${{ github.sha }} \
            ghcr.io/albrightlaboratories/kanboard-mcp:${{ github.sha }}

      - name: Deploy to cluster
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/kanboard -n hr-project-tracking --timeout=120s
          kubectl rollout status deployment/kanboard-ui -n hr-project-tracking --timeout=120s
          kubectl rollout status deployment/kanboard-backend -n hr-project-tracking --timeout=120s
          kubectl rollout status deployment/kanboard-mcp -n hr-project-tracking --timeout=120s

      - name: Verify deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods -n hr-project-tracking
          echo ""
          echo "Checking services..."
          kubectl get svc -n hr-project-tracking
          echo ""
          echo "Dashboard available at: http://$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}'):30080"
